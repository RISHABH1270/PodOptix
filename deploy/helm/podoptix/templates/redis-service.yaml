apiVersion: v1
kind: Service
metadata:
  name: {{ include "podoptix.redisName" . }}
  labels:
    {{- include "podoptix.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP        # internal-only — never exposed to public
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    {{- include "podoptix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
