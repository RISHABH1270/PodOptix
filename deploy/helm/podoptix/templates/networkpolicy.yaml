{{- if .Values.networkPolicy.enabled }}
---
# PodOptix — allow ingress from the same namespace + optional extra namespaces
# on port 8080. Egress is left open (needs to reach Prometheus URLs registered
# by users, plus in-namespace Postgres and Redis).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "podoptix.fullname" . }}
  labels:
    {{- include "podoptix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "podoptix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- range .Values.networkPolicy.extraIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
# Postgres — internal-only. Only PodOptix pods in the same namespace can reach 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "podoptix.postgresName" . }}
  labels:
    {{- include "podoptix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "podoptix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "podoptix.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 5432
---
# Redis — internal-only. Only PodOptix pods in the same namespace can reach 6379.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "podoptix.redisName" . }}
  labels:
    {{- include "podoptix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "podoptix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "podoptix.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
