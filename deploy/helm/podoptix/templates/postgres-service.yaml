apiVersion: v1
kind: Service
metadata:
  name: {{ include "podoptix.postgresName" . }}
  labels:
    {{- include "podoptix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP        # internal-only — never exposed to public
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    {{- include "podoptix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
