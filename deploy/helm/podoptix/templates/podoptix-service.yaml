apiVersion: v1
kind: Service
metadata:
  name: {{ include "podoptix.fullname" . }}
  labels:
    {{- include "podoptix.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "podoptix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
