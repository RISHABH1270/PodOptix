{{- /*
Secret with 3 values: POSTGRES_PASSWORD, JWT_SECRET, ENCRYPTION_KEY.

Precedence:
  1. Explicit value from values.yaml (if provided)
  2. Existing value in the cluster (preserved across `helm upgrade`)
  3. Auto-generated random string on first install

`lookup` returns nil on first install — must guard with `if` before indexing.
*/ -}}

{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "podoptix.secretName" .) -}}

{{- $postgresPass := .Values.postgres.password -}}
{{- if and (not $postgresPass) $existing -}}
  {{- $postgresPass = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $postgresPass -}}
  {{- $postgresPass = randAlphaNum 24 -}}
{{- end -}}

{{- $jwtSecret := .Values.podoptix.jwtSecret -}}
{{- if and (not $jwtSecret) $existing -}}
  {{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec -}}
{{- end -}}
{{- if not $jwtSecret -}}
  {{- $jwtSecret = randAlphaNum 48 -}}
{{- end -}}

{{- $encKey := .Values.podoptix.encryptionKey -}}
{{- if and (not $encKey) $existing -}}
  {{- $encKey = index $existing.data "ENCRYPTION_KEY" | b64dec -}}
{{- end -}}
{{- if not $encKey -}}
  {{- $encKey = randAlphaNum 32 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podoptix.secretName" . }}
  labels:
    {{- include "podoptix.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $postgresPass | b64enc }}
  JWT_SECRET:        {{ $jwtSecret | b64enc }}
  ENCRYPTION_KEY:    {{ $encKey | b64enc }}
