services:

  postgres:
    image: postgres:16
    container_name: podoptix-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: podoptix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: podoptix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local Prometheus for testing the PodOptix pipeline end-to-end.
  # Uses the image's default config (scrapes itself only).
  # Register a cluster in PodOptix pointing at http://localhost:9090 to test connectivity + recalculate.
  # For real recommendations, point PodOptix at a Prometheus scraping cAdvisor + kube-state-metrics.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: podoptix-prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
